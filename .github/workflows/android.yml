name: Build Mianboor APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build hev-socks5-tunnel (native TUN -> SOCKS5 bridge)
        run: |
          NDK_DIR=$(ls -d ${ANDROID_HOME}/ndk/* | head -1)
          echo "Using NDK: ${NDK_DIR}"
          mkdir -p /tmp/hevbuild
          cd /tmp/hevbuild
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel jni
          ${NDK_DIR}/ndk-build \
            APP_ABI=arm64-v8a APP_PLATFORM=android-26 \
            APP_CFLAGS="-O3 -DPKGNAME=com/mianboor/vpn -DCLSNAME=TProxyService"
          mkdir -p "${GITHUB_WORKSPACE}/android/app/src/main/jniLibs/arm64-v8a"
          cp libs/arm64-v8a/libhev-socks5-tunnel.so \
             "${GITHUB_WORKSPACE}/android/app/src/main/jniLibs/arm64-v8a/"
          file libs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download Xray core (Android arm64)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -sSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o /tmp/xray.zip -d /tmp/xraybin
          cp /tmp/xraybin/xray android/app/src/main/jniLibs/arm64-v8a/libxray.so
          file android/app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Restore release keystore
        env:
          MB_KEYSTORE_BASE64: ${{ secrets.MB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MB_KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$MB_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "Keystore restored:"
            ls -la android/keystore/
          else
            echo "MB_KEYSTORE_BASE64 not set — falling back to debug signing."
          fi

      - name: Build release APK
        working-directory: android
        env:
          MIANOOR_SERVER_URL: ${{ secrets.MIANOOR_SERVER_URL }}
          MIANOOR_CLIENT_TOKEN: ${{ secrets.MIANOOR_CLIENT_TOKEN }}
          MIANOOR_ADMIN_KEY: ${{ secrets.MIANOOR_ADMIN_KEY }}
          MB_STORE_PASSWORD: ${{ secrets.MB_STORE_PASSWORD }}
          MB_KEY_ALIAS: ${{ secrets.MB_KEY_ALIAS }}
          MB_KEY_PASSWORD: ${{ secrets.MB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Secrets come from repo settings only — no defaults, no fallbacks.
          SERVER_URL="${MIANOOR_SERVER_URL:-https://mianboor.vercel.app}"
          CLIENT_TOKEN="${MIANOOR_CLIENT_TOKEN:-}"
          echo "Building with SERVER_URL=$SERVER_URL"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PMIANOOR_SERVER_URL="$SERVER_URL" \
            -PMIANOOR_CLIENT_TOKEN="$CLIENT_TOKEN" \
            -PMIANOOR_ADMIN_KEY="${MIANOOR_ADMIN_KEY:-}" \
            -PMB_STORE_FILE=android/keystore/release.jks \
            -PMB_STORE_PASSWORD="$MB_STORE_PASSWORD" \
            -PMB_KEY_ALIAS="$MB_KEY_ALIAS" \
            -PMB_KEY_PASSWORD="$MB_KEY_PASSWORD"

      - name: Prepare APK artifact
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ "$VER" = "$GITHUB_REF_NAME" ]; then VER="1.6.1"; fi
          APK_NAME="Mianboor-v${VER}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -la "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mianboor-APK
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}

      - name: Announce in-app update (sets latest version on the server)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ADMIN_KEY: ${{ secrets.MIANOOR_ADMIN_KEY }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' android/app/build.gradle.kts | head -1)
          KEY="${ADMIN_KEY:-}"
          echo "Announcing v$VER (code $CODE) to the server…"
          curl -sS -m 20 -X PUT "https://mianboor.vercel.app/api/admin/settings" \
            -H "x-admin-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"latestVersion\":\"$VER\",\"latestCode\":$CODE,\"latestUrl\":\"https://github.com/mostafaiekii/mianboor/releases/tag/$GITHUB_REF_NAME\"}" \
            || echo "announce failed — the app falls back to checking GitHub Releases directly"

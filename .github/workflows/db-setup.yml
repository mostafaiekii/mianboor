name: DB Setup (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Neon project and extract connection string
        run: |
          set -e
          RESP=$(curl -sS -X POST https://api.neon.tech/v2/projects \
            -H "Authorization: Bearer ${{ secrets.NEON_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"project":{"name":"mianboor"}}')
          URI=$(echo "$RESP" | jq -r '.connection_uris[0].connection_uri // empty')
          if [ -z "$URI" ]; then
            echo "::error::Neon project creation failed"
            echo "$RESP" | head -c 600
            exit 1
          fi
          echo "::add-mask::$URI"
          case "$URI" in
            *pooler*) POOLED="$URI" ;;
            *) POOLED=$(echo "$URI" | sed -E 's/\.([a-z0-9-]+)\.aws\.neon\.tech/-pooler.\1.aws.neon.tech/') ;;
          esac
          echo "::add-mask::$POOLED"
          printf '%s' "$POOLED" > /tmp/dburl
          echo "Neon project created (connection string masked)"

      - name: Push Prisma schema to Neon
        run: |
          set -e
          export DATABASE_URL="$(cat /tmp/dburl)"
          npx --yes prisma@6.11.1 db push --skip-generate --accept-data-loss

      - name: Set DATABASE_URL on Vercel
        run: |
          set -e
          VAL="$(cat /tmp/dburl)&pgbouncer=true"
          echo "::add-mask::$VAL"
          jq -n --arg v "$VAL" '[{key:"DATABASE_URL",value:$v,type:"encrypted",target:["production","preview","development"]}]' > /tmp/envbody.json
          CODE=$(curl -sS -o /tmp/envresp.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v9/projects/mianboor/env?teamId=${{ secrets.VERCEL_TEAM_ID }}&upsert=true" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/envbody.json)
          echo "vercel env HTTP $CODE"
          head -c 300 /tmp/envresp.json
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then exit 1; fi

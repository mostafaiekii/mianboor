<?xml version="1.0" encoding="utf-8"?>
<!-- Mianboor — the M-gateway mark: glowing M portal + golden shortcut light -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mianboor">
  <defs>
    <linearGradient id="mglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CFFE0"/>
      <stop offset="1" stop-color="#22D3A5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#22D3A5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3A5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#000235"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <!-- M as the gateway -->
  <path d="M168,356 V196 q0,-20 18,-9 l70,64 70,-64 q18,-11 18,9 v160"
        fill="none" stroke="url(#mglow)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- golden shortcut light passing through the gate -->
  <path d="M256,292 C238,318 274,330 256,358"
        fill="none" stroke="#FFC94D" stroke-width="22" stroke-linecap="round"/>
  <path d="M256,366 v26" stroke="#FFC94D" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
</svg>
